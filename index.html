<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動暈症即時監控面板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 現代深色模式佈局 */
        body {
            background-color: #121212;
            color: #E0E0E0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 基礎監控容器：置中且單一面板 */
        .dashboard-container {
            background-color: #1E1E1E;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #FFFFFF;
        }

        .data-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 16px 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        /* 狀態色彩編碼：正常綠色，警示紫色 */
        .status-normal { color: #4CAF50; }
        .status-warning { color: #AB47BC; }

        .btn {
            background-color: #333333;
            color: #FFFFFF;
            border: 1px solid #555555;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .btn:hover {
            background-color: #444444;
        }

        canvas {
            background-color: #252525;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>即時動態加速度監控</h2>
        <button class="btn" id="startBtn">啟動感測器 (iOS 需授權)</button>
        
        <div class="data-display status-normal" id="accValue">0.00 m/s²</div>
        <div id="statusText" class="status-normal">狀態：平穩</div>

        <canvas id="accChart" width="400" height="200"></canvas>
    </div>

    <script>
        // 系統參數設定
        const THRESHOLD = 1.5; // 暈車警示閥值 (m/s²)
        const MAX_DATA_POINTS = 50; // 圖表緩衝區大小
        let isRunning = false;

        // 初始化圖表 (Chart.js)
        const ctx = document.getElementById('accChart').getContext('2d');
        const accChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(MAX_DATA_POINTS).fill(''),
                datasets: [{
                    label: '合成加速度 (m/s²)',
                    data: Array(MAX_DATA_POINTS).fill(0),
                    borderColor: '#4CAF50', // 預設綠色
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                animation: false, // 關閉動畫以應付高頻率更新
                scales: {
                    y: {
                        min: 0,
                        max: 5,
                        grid: { color: '#333333' }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // UI 元素
        const accValueEl = document.getElementById('accValue');
        const statusTextEl = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');

        // 處理設備移動事件
        function handleMotion(event) {
            // 取得排除重力的線性加速度
            const acc = event.acceleration; 
            if (!acc || acc.x === null) return;

            // 計算三軸合成向量大小： M = sqrt(x^2 + y^2 + z^2)
            const magnitude = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);
            const displayMag = magnitude.toFixed(2);

            // 更新 UI 數值
            accValueEl.textContent = `${displayMag} m/s²`;

            // 閥值判定與色彩狀態切換
            if (magnitude > THRESHOLD) {
                accValueEl.className = 'data-display status-warning';
                statusTextEl.className = 'status-warning';
                statusTextEl.textContent = '狀態：動態過大 (易暈車)';
                accChart.data.datasets[0].borderColor = '#AB47BC'; // 切換為紫色線條
            } else {
                accValueEl.className = 'data-display status-normal';
                statusTextEl.className = 'status-normal';
                statusTextEl.textContent = '狀態：平穩';
                accChart.data.datasets[0].borderColor = '#4CAF50'; // 恢復為綠色線條
            }

            // 更新圖表緩衝區 (FIFO)
            accChart.data.datasets[0].data.push(magnitude);
            accChart.data.datasets[0].data.shift();
            accChart.update();
        }

        // 啟動感測器按鈕邏輯 (包含 iOS 13+ 權限要求)
        startBtn.addEventListener('click', () => {
            if (isRunning) return;

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                // 針對 iOS 設備的權限請求
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            startBtn.textContent = '感測器運作中...';
                            isRunning = true;
                        } else {
                            alert('需要感測器權限才能監控資料。');
                        }
                    })
                    .catch(console.error);
            } else {
                // 非 iOS 或舊版設備直接監聽
                window.addEventListener('devicemotion', handleMotion);
                startBtn.textContent = '感測器運作中...';
                isRunning = true;
            }
        });
    </script>
</body>
</html>
